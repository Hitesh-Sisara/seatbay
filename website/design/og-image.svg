<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <title>Seatbay: run multiple Claude Desktop accounts on one Mac</title>
  <defs>
    <radialGradient id="glow-violet" cx="0.12" cy="-0.1" r="0.75">
      <stop offset="0" stop-color="#6a45f0" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#6a45f0" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glow-blue" cx="0.95" cy="0.05" r="0.7">
      <stop offset="0" stop-color="#1f66e8" stop-opacity="0.45"/>
      <stop offset="1" stop-color="#1f66e8" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glow-green" cx="0.6" cy="1.15" r="0.6">
      <stop offset="0" stop-color="#13a066" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#13a066" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="halo" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#7d62ff" stop-opacity="0.45"/>
      <stop offset="0.6" stop-color="#2f6fe8" stop-opacity="0.12"/>
      <stop offset="1" stop-color="#2f6fe8" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="headline" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#b9a8ff"/>
      <stop offset="0.5" stop-color="#74b0ff"/>
      <stop offset="1" stop-color="#5fe0a8"/>
    </linearGradient>
    <pattern id="grid" width="48" height="48" patternUnits="userSpaceOnUse">
      <path d="M48 0H0V48" fill="none" stroke="#ffffff" stroke-opacity="0.04" stroke-width="1"/>
    </pattern>

    <!-- Seatbay icon parts (from assets/seatbay-icon.svg, ids prefixed) -->
    <linearGradient id="i-bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#232838"/>
      <stop offset="1" stop-color="#0d1017"/>
    </linearGradient>
    <linearGradient id="i-shelf" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.16"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0.06"/>
    </linearGradient>
    <linearGradient id="i-violet" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#9a80ff"/>
      <stop offset="1" stop-color="#6a45f0"/>
    </linearGradient>
    <linearGradient id="i-blue" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#4f97ff"/>
      <stop offset="1" stop-color="#1f66e8"/>
    </linearGradient>
    <linearGradient id="i-green" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3fd08f"/>
      <stop offset="1" stop-color="#13a066"/>
    </linearGradient>
    <filter id="i-lift" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="14" stdDeviation="16" flood-color="#000000" flood-opacity="0.45"/>
    </filter>
    <filter id="i-card" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="30" stdDeviation="40" flood-color="#000000" flood-opacity="0.6"/>
    </filter>
    <g id="i-tiles">
      <g filter="url(#i-lift)">
        <rect x="198" y="404" width="196" height="196" rx="50" fill="url(#i-violet)"/>
        <rect x="404" y="334" width="216" height="216" rx="55" fill="url(#i-blue)"/>
        <rect x="630" y="404" width="196" height="196" rx="50" fill="url(#i-green)"/>
      </g>
      <g fill="none" stroke="#ffffff" stroke-width="27" stroke-linecap="round" stroke-linejoin="round">
        <path d="M279.0,469.0 L301.0,454.0 L301.0,550.0"/>
        <path d="M479.6,418.2 C481.8,388.0 544.4,381.5 545.5,418.2 C546.6,446.3 509.8,463.6 478.5,493.8 L548.7,493.8"/>
        <path d="M698.0,466.0 C714.0,448.0 758.0,448.0 758.0,477.0 C758.0,496.0 740.0,501.0 724.0,501.0 C742.0,501.0 762.0,508.0 762.0,528.0 C762.0,558.0 714.0,560.0 695.0,540.0"/>
      </g>
    </g>
  </defs>

  <!-- background -->
  <rect width="1200" height="630" fill="#0b0e15"/>
  <rect width="1200" height="630" fill="url(#glow-violet)"/>
  <rect width="1200" height="630" fill="url(#glow-blue)"/>
  <rect width="1200" height="630" fill="url(#glow-green)"/>
  <rect width="1200" height="630" fill="url(#grid)"/>

  <!-- wordmark: the three tiles (logo mark) + name -->
  <g transform="translate(45.6 19.65) scale(0.1467)">
    <use href="#i-tiles"/>
  </g>
  <text x="184" y="101" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="38" font-weight="700" fill="#ffffff" letter-spacing="-0.5">Seatbay</text>

  <!-- headline -->
  <g font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-weight="700" letter-spacing="-1.6">
    <text x="70" y="228" font-size="62" fill="#ffffff">Run multiple</text>
    <text x="70" y="300" font-size="62" fill="#ffffff">Claude Desktop</text>
    <text x="70" y="372" font-size="62" fill="url(#headline)">accounts on one Mac.</text>
  </g>

  <!-- subline -->
  <g font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="25" fill="#a7aec2">
    <text x="72" y="434">Each one signed in to its own account or API key,</text>
    <text x="72" y="468">with its own coloured, numbered Dock icon.</text>
  </g>

  <!-- footer -->
  <line x1="72" y1="522" x2="1128" y2="522" stroke="#ffffff" stroke-opacity="0.1"/>
  <text x="72" y="568" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="22" fill="#8d94a9">Free and open source  ·  MIT  ·  macOS 14+  ·  Apple silicon and Intel</text>
  <text x="1128" y="568" text-anchor="end" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="22" font-weight="700" fill="#e3e6f0">seatbay.sisara.in</text>

  <!-- the app icon -->
  <circle cx="946" cy="282" r="250" fill="url(#halo)"/>
  <g transform="translate(717 53) scale(0.445)">
    <g filter="url(#i-card)">
      <rect x="100" y="100" width="824" height="824" rx="185" fill="url(#i-bg)"/>
    </g>
    <rect x="100.5" y="100.5" width="823" height="823" rx="184.5" fill="none" stroke="#ffffff" stroke-opacity="0.12" stroke-width="2"/>
    <rect x="164" y="528" width="696" height="168" rx="56" fill="url(#i-shelf)" stroke="#ffffff" stroke-opacity="0.18" stroke-width="3"/>
    <use href="#i-tiles"/>
    <g fill="#ffffff" fill-opacity="0.75">
      <circle cx="296" cy="648" r="10"/><circle cx="512" cy="648" r="10"/><circle cx="728" cy="648" r="10"/>
    </g>
  </g>
</svg>
