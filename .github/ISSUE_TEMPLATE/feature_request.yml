name: Feature request
description: Suggest an idea for Seatbay
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: What would you like to do?
      description: The problem or workflow, in your own words.
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: How could Seatbay help?
